<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e83e8c"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Book icon -->
  <g transform="translate(256,256)" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left page -->
    <path d="M-8,-80 C-8,-80 -100,-100 -140,-80 L-140,80 C-100,60 -8,80 -8,80"/>
    <!-- Right page -->
    <path d="M8,-80 C8,-80 100,-100 140,-80 L140,80 C100,60 8,80 8,80"/>
    <!-- Spine -->
    <line x1="0" y1="-80" x2="0" y2="80"/>
  </g>
</svg>
